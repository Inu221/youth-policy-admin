version: '3.9'

services:
  app:
    image: ghcr.io/inu221/youth-policy-admin:latest
    container_name: youth_policy_admin_app
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${APP_HTTP_PORT:-80}:80"
    volumes:
      - app_storage:/var/www/html/storage
      - app_bootstrap_cache:/var/www/html/bootstrap/cache

volumes:
  app_storage:
  app_bootstrap_cache:
